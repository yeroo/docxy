[package]
name = "pdffont"
description = "System font discovery for PDF export: the PdfFontProvider terminal docxy hands to docxcore."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
docxcore = { version = "0.5.0", path = "../docxcore" }
# Reads the cmap, advances and names of a face; docxcore stays dependency-free.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
