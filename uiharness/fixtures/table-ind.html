<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Indented tables</title></head>
<body>
<p>Tables in indented blocks (#2151).</p>
<table width="300" border="1"><tr><td>body</td></tr></table>
<div style="margin-left:40px"><table width="300" border="1"><tr><td style="padding-left:10px">indented</td></tr></table></div>
<blockquote><table width="300" border="1" cellpadding="4"><tr><td>quoted</td></tr></table></blockquote>
</body></html>
