[package]
name = "uiharness"
description = "The suite's UI test driver: control verbs, window capture and pixel assertions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The control protocol the harness instance serves. Dependency-free itself.
ctlcore = { path = "../ctlcore" }
# CRC-32 for the PNG chunks — the same routine the ZIP writer uses. No image
# or compression crate: the encoder here is ~200 lines of RFC 1951 and RFC 2083,
# and it is round-tripped in tests against opccore's own inflater.
opccore = { path = "../opccore" }

[target.'cfg(target_os = "linux")'.dependencies]
# Read the actual X11 client window; no gpui test-support/offscreen build.
x11rb = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Only to BUILD and check the fixture workbook (`tests/fixture.rs`). The harness
# binary itself has no spreadsheet engine in it and does not want one: it reads
# pixels and JSON. Hand-writing an xlsx with a chart part in it would be six
# XML files nobody would ever check, so the fixture is generated by the same
# writer the app loads it with.
gridcore = { path = "../gridcore" }

# `tests/agwinterm_env.rs` watches the suite's child processes (#697).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Diagnostics_ToolHelp"] }
