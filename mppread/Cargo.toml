[package]
name = "mppread"
description = "Reader for legacy Office CFB containers and MS Project .mpp import into projcore."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["cfb", "ole2", "mpp", "compound-file", "msproject"]
categories = ["parser-implementations"]

[lints]
workspace = true

[dependencies]
# std-only plus our project model and the shared CFB reader in opccore.
opccore = { version = "0.1.0", path = "../opccore" }
projcore = { version = "0.1.0", path = "../projcore" }
