[package]
name = "docxy"
description = "docxy — the doc-centric desktop suite: docs / sheets / mail in tabs, on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# The app is branded "docxy" (shown in the UI), but the produced executable is
# `suite.exe` so it never collides with the existing terminal `docxy` binary in
# the root workspace.
[[bin]]
name = "suite"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
opccore = { version = "0.1.0", path = "../../opccore" }
# Commit / last merged PR / build kind, for --version, File > Account, app-info and the crash log.
buildinfo = { path = "../../buildinfo" }
projctl = { path = "../../projctl" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
docxcore = { path = "../../docxcore" }
# Editable HTML (*.docx.html): open and re-save bundles always; make new ones
# with the `html-export` feature (embeds the docxwasm engine, see build.rs).
htmlbundle = { path = "../../htmlbundle" }
gridcore = { path = "../../gridcore" }
projcore = { path = "../../projcore" }
mppread = { path = "../../mppread" }
# Loopback-JSON control for normal Project tabs and the opt-in UI test harness.
ctlcore = { path = "../../ctlcore" }
flume = "0.12"
ribbonspec = { path = "../../ribbonspec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Custom Save / Don't Save / Cancel labels on Windows require v6 controls;
# GPUI's default windows-manifest feature already selects that assembly.
rfd = { version = "0.15", features = ["common-controls-v6"] }
rust-embed = "8"

# The plain AppKit menu bar a native dialog runs under (#1071, macos_menu.rs).
# Already in the lock through rfd.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }

[build-dependencies]
htmlbundle = { path = "../../htmlbundle" }

[features]
# Embed the docxwasm engine so Save As "Editable HTML (*.docx.html)" can make
# new bundles. Needs the wasm32-unknown-unknown target, or DOCXY_HTML_ENGINE.
html-export = []
# Offscreen window capture for the UI test harness, macOS only.
#
# Turns on gpui's test-support through `gpui_platform`, which is the only way
# to reach the Metal renderer's render-to-texture: the macOS implementation is
# gated on `gpui_macos`'s own test-support feature, so enabling `gpui`'s alone
# builds cleanly and then answers every capture with "not implemented for this
# platform". ⚠️ Not a neutral switch: test-support also makes gpui draw every
# dirty window on each effect flush and turns on leak detection, so pixel cases
# run against a build that schedules its draws differently from the shipped
# app. Never enable it in a shipped build. Refused off macOS; see main.rs.
harness-capture = ["gpui_platform/test-support"]

# Embeds the Windows app icon (assets/docxy.ico) into suite.exe via docxy.rc.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
