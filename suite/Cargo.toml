# The GPUI-based cross-platform UI suite (docxy / xlsxy / lookxy) — a SEPARATE
# workspace from the stable cores + COM shims at the repo root. GPUI is a heavy,
# fast-moving, recent-Rust dependency pulled from the zed monorepo; keeping it in
# its own workspace (own Cargo.lock, own MSRV/edition) means it never bloats or
# destabilizes the cores/shims build. UI crates path-depend on the sibling cores
# (../docxcore, ../gridcore, ...) which remain owned by the root workspace.
[workspace]
resolver = "2"
members = ["docxy", "pdfpages"]
# The patched gpui_linux (#1966) is a path dependency, not a member: its own
# lints and tests are upstream's, and `cargo test --workspace` stays ours.
exclude = ["vendor/gpui_linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["yeroo"]
repository = "https://github.com/yeroo/docxy"

# gpui lives in the zed monorepo and is NOT semver-stable. gpui-component depends
# on it with NO rev (zed's default branch), so we MUST match that spec exactly —
# declaring our own `rev` creates a SECOND gpui copy and a type/symbol mismatch
# (gpui-component built against a newer gpui than a stale pinned rev). Both use
# `{ git = ".../zed" }`; cargo unifies them to one commit, and reproducibility
# comes from our committed suite/Cargo.lock (bump with `cargo update -p gpui`).
# The same accepted style choices the root workspace records, so this workspace
# can also run `clippy -D warnings`: index loops over parallel grids read clearer
# than combinators, and nested `if let { if … }` reads clearer than a let-chain.
[workspace.lints.clippy]
needless_range_loop = "allow"
explicit_counter_loop = "allow"
should_implement_trait = "allow"
field_reassign_with_default = "allow"
collapsible_if = "allow"
large_enum_variant = "allow"
# The two grid render entry points (`sheet_el`, `sheet_row`) take a slice of view
# state each; bundling it into structs only moves the parameters somewhere else.
too_many_arguments = "allow"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }
# Bundled icon/font assets (SVG icons for buttons + the window controls). Without
# registering these via `.with_assets(Assets)`, icon elements render blank.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "bc174a7ec4534b2a4174fddde314b38d30d69093" }

# Matches gpui-component's own patch (its build assumes it).
[patch.crates-io]
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }

# The PDF view's renderer (#2245): `pdfcraft-render` is built against PdfCraft's own
# patched copies of these crates (its `vendor/`, each patch meant to go upstream;
# lopdf's carries fuzz fixes: predictor row allocations, `/Length` lookup chains,
# object-stream budgets). Cargo never applies a dependency's `[patch]`, so this
# table repeats PdfCraft's root `[patch.crates-io]` at the same rev, minus its
# egui/winit entries (not built here). A bump of the `pdfcraft-render` rev in
# docxy/Cargo.toml moves every entry with it: compare the two tables.
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "eeee51ff7b805b52652a7e00305cc8cf91748239" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "e7873217287876f76a045550369c90a541693c33" }

# gpui_linux with the suite's patch to its Wayland clipboard (#1966): a copy
# offers RTF/HTML beside its text and a paste reads another app's. The vendored
# crate is upstream at the zed rev this lock pins plus `vendor/gpui_linux.patch`
# (`scripts/vendor-gpui-linux.py --check`); see `vendor/README.md` for a bump.
[patch."https://github.com/zed-industries/zed"]
gpui_linux = { path = "vendor/gpui_linux" }

# gpui is laggy fully-unoptimized (per-frame/per-key redraw), so give it opt-level=1
# for a smooth editor runtime while keeping compile time reasonable. It's a one-time
# gpui recompile; our own crate then stays fast to iterate.
[profile.dev.package.gpui]
opt-level = 1
[profile.dev.package.gpui_platform]
opt-level = 1

# The PDF renderer (#2245) is 25-40x slower unoptimized, and the suite's tests
# render the PDF corpus through it.
[profile.dev.package.hayro]
opt-level = 2
[profile.dev.package.hayro-interpret]
opt-level = 2
[profile.dev.package.hayro-syntax]
opt-level = 2
[profile.dev.package.hayro-cmap]
opt-level = 2
[profile.dev.package.hayro-jbig2]
opt-level = 2
[profile.dev.package.vello_common]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 2
[profile.dev.package.lopdf]
opt-level = 2
[profile.dev.package.pdfcraft-render]
opt-level = 2
[profile.dev.package.craft-pdf]
opt-level = 2
[profile.dev.package.pdfcraft-forms]
opt-level = 2
[profile.dev.package.pdfcraft-annot]
opt-level = 2

# Line tables in release builds, so a backtrace in crash.log names the source
# line of each frame (#795). On Windows they live in suite.pdb, which the
# installer ships next to suite.exe; on Linux they are in the binary.
[profile.release]
debug = "line-tables-only"

# The PDF engine for the wasm editors (#2259): `pdfpages.wasm`, built with
# `cargo build -p pdfpages --lib --target wasm32-unknown-unknown --profile wasm`
# (offxy-vscode's `build:wasm`). Its own profile so the suite's release keeps its
# line tables and unwinding: wasm32 cannot unwind anyway, and the webview
# replaces an instance that trapped.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
panic = "abort"
