<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="docxy editable HTML">
<title>{{title}}</title>
<style id="docxy-css">{{css}}</style>
</head>
<body>
<noscript><p class="noscript">{{title}} is a Word document saved as editable HTML by docxy. Turn on JavaScript to view and edit it here, or open this file in docxy to get the .docx back.</p></noscript>
<div id="app"></div>
<script type="application/json" id="docxy-shell">{{shell}}</script>
<script type="application/json" id="docxy-ribbon">{{ribbon}}</script>
<script type="application/x-docxy-engine" id="docxy-engine">{{engine}}</script>
<script id="docxy-engine-js">{{engine_js}}</script>
<script id="docxy-app-js">{{app_js}}</script>
<script type="application/x-docxy-payload" id="docxy-payload">{{payload}}</script>
</body>
</html>
