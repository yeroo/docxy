name: release

# Tag a version to cut a release:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create release + upload assets
      id-token: write # keyless provenance + cosign signing
      attestations: write # build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            suffix: windows-x86_64.exe
            ext: ".exe"
          - os: macos-latest
            suffix: macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux clipboard deps (arboard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release -p docxy -p xlsxy

      - name: Stage binaries + checksums
        shell: bash
        run: |
          mkdir -p dist
          for bin in docxy xlsxy; do
            cp "target/release/${bin}${{ matrix.ext }}" "dist/${bin}-${{ matrix.suffix }}"
          done
          cd dist
          for asset in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
            cat "$asset.sha256"
          done

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/docxy-${{ matrix.suffix }}
            dist/xlsxy-${{ matrix.suffix }}

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          for bin in docxy xlsxy; do
            cosign sign-blob --yes \
              --output-signature "dist/${bin}-${{ matrix.suffix }}.sig" \
              --output-certificate "dist/${bin}-${{ matrix.suffix }}.pem" \
              "dist/${bin}-${{ matrix.suffix }}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  vsix:
    name: package VS Code extension
    permissions:
      contents: write # attach the .vsix to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the .vsix
        working-directory: offxy-vscode
        # `vsce package` runs the vscode:prepublish script, which builds both
        # the docxwasm and gridwasm wasm crates (cargo) and bundles the
        # extension before packaging.
        run: |
          npm ci
          npx --yes @vscode/vsce@latest package --no-dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: offxy-vsix
          path: offxy-vscode/*.vsix

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: offxy-vscode/*.vsix

  jetbrains:
    name: package JetBrains plugin
    permissions:
      contents: write # attach the plugin zip to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the plugin zip
        working-directory: offxy-jetbrains
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: offxy-jetbrains-zip
          path: offxy-jetbrains/build/distributions/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: offxy-jetbrains/build/distributions/*.zip

      - name: Publish to JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        working-directory: offxy-jetbrains
        # The FIRST upload must be manual (Marketplace rule); this step keeps
        # subsequent tagged releases in sync. Skips cleanly when the token
        # secret isn't configured — same stance as the crates.io publish.
        run: |
          if [ -z "${JETBRAINS_MARKETPLACE_TOKEN:-}" ]; then
            echo "JETBRAINS_MARKETPLACE_TOKEN not set — skipping Marketplace publish."
            exit 0
          fi
          ./gradlew publishPlugin --no-daemon

  publish:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.fork
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux clipboard deps (arboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Publish crates (dependency order, skip already-published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Cutting a binary release shouldn't fail just because the crates.io
          # token isn't configured — skip the publish cleanly when it's absent.
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          # opccore/gridcore/xlsxy version independently of the docxy release
          # train, so a tag often re-carries versions that are already on
          # crates.io. Publishing those again would hard-fail the job, so each
          # crate is skipped when its exact version is already indexed.
          publish() {
            crate="$1"
            ver=$(cargo pkgid -p "$crate" | sed 's/.*[@#]//')
            if curl -fsSL -A "docxy-release-workflow" \
                 "https://crates.io/api/v1/crates/${crate}/${ver}" >/dev/null 2>&1; then
              echo "${crate} ${ver} is already on crates.io — skipping."
              return 0
            fi
            cargo publish -p "$crate"
            # Give crates.io a moment to index before dependents publish.
            sleep 30
          }
          publish opccore
          publish docxcore
          publish gridcore
          publish docxy
          publish xlsxy

  windows-installers:
    name: Windows installers (Inno Setup)
    runs-on: windows-latest
    permissions:
      contents: write # attach installers to the release
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            suite

      - name: Derive version
        id: ver
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == v* ]]; then V="${REF#v}"; V="${V%%-*}"; else V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build TUI (docxy + xlsxy)
        run: cargo build --release -p docxy -p xlsxy

      - name: Build desktop suite (suite.exe)
        run: cargo build --release --manifest-path suite/Cargo.toml

      - name: Stage the Office COM shims
        shell: pwsh
        run: ./tools/package-shims.ps1 -OutDir dist/office-shims

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "${{ steps.ver.outputs.version }}"
          $out = Join-Path $PWD 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $iscc "/DAppVersion=$ver" "/DSrcDir=$PWD\suite\target\release" "/DIcoDir=$PWD\suite\docxy\assets" "/O$out" "packaging\inno\suite.iss"
          if ($LASTEXITCODE -ne 0) { throw "suite.iss compile failed ($LASTEXITCODE)" }
          & $iscc "/DAppVersion=$ver" "/DSrcDir=$PWD\target\release" "/O$out" "packaging\inno\tui.iss"
          if ($LASTEXITCODE -ne 0) { throw "tui.iss compile failed ($LASTEXITCODE)" }
          & $iscc "/DAppVersion=$ver" "/DSrcDir=$PWD\dist\office-shims" "/O$out" "packaging\inno\comshim.iss"
          if ($LASTEXITCODE -ne 0) { throw "comshim.iss compile failed ($LASTEXITCODE)" }
          $exes = @(Get-ChildItem "$out\*.exe")
          if ($exes.Count -ne 3) { throw "expected 3 installers, got $($exes.Count)" }
          $exes | ForEach-Object { $_.Name }

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: out/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe

  macos-packages:
    name: macOS packages (tarball + .dmg)
    runs-on: macos-latest # arm64
    permissions:
      contents: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            suite

      - name: Derive version
        id: ver
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == v* ]]; then V="${REF#v}"; V="${V%%-*}"; else V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build TUI (docxy + xlsxy)
        run: cargo build --release -p docxy -p xlsxy

      - name: Build desktop suite
        run: cargo build --release --manifest-path suite/Cargo.toml

      - name: Package TUI tarball
        run: |
          mkdir -p out
          tar -C target/release -czf "out/docxy-cli-macos-aarch64.tar.gz" docxy xlsxy
          ( cd out && shasum -a 256 docxy-cli-macos-aarch64.tar.gz > docxy-cli-macos-aarch64.tar.gz.sha256 )

      - name: Build docxy.app + .dmg
        run: bash packaging/macos/make-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: macos-packages
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
            out/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/*.dmg
