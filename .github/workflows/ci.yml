name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # docxy's `html-export` feature builds the docxwasm engine it embeds.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux clipboard deps (arboard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (html-export)
        run: cargo clippy -p docxy --all-targets --features html-export -- -D warnings
      - name: Build
        run: cargo build --workspace --locked --features docxy/html-export
      - name: Test
        run: cargo test --workspace --locked --features docxy/html-export

  fidelity-gate:
    name: fidelity gate (docx, xlsx)
    # Open + save with no edits must not lose anything (#1060, #1064): every
    # docxy-corpus .docx round-trips through save_package, and every .xlsx
    # through save_xlsx_for_path, and is compared part by part with the
    # original, against the allowlist and the shrink-only baseline in
    # docxcore/tests/fidelity/ and gridcore/tests/fidelity/. Each saved .docx
    # is also schema-validated: a violation the save added fails, with no
    # baseline (#1083). The `test` job runs the same tests without the
    # external corpus (repo-tracked files only); here FIDELITY_REQUIRE_CORPUS
    # makes a missing checkout a failure.
    # See docs/fidelity-gate.md.
    runs-on: ubuntu-latest
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - name: Check out docxy-corpus
        uses: actions/checkout@v7
        with:
          repository: yeroo/docxy-corpus
          path: corpus-ext
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fidelity gate (docx)
        env:
          FIDELITY_CORPUS: corpus-ext/files
          FIDELITY_REQUIRE_CORPUS: "1"
        run: cargo test -p docxcore --test fidelity --locked -- --nocapture
      - name: Fidelity gate (xlsx)
        # Reported even when the docx step failed.
        if: ${{ !cancelled() }}
        env:
          FIDELITY_XLSX_CORPUS: corpus-ext/xlsx-ext
          FIDELITY_REQUIRE_CORPUS: "1"
        run: cargo test -p gridcore --test fidelity --locked -- --nocapture

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux clipboard deps (arboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
        # Compile tests too, so a newer-than-MSRV feature in test code is
        # caught rather than sailing through a bin-only build.
      - run: cargo build --workspace --all-targets --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux clipboard deps (arboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          # Public repo: tokenless upload works; a token (repo secret) just
          # makes uploads more reliable. Never fail CI on an upload hiccup.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  suite:
    name: desktop suite
    # ⚠️ `suite/` is its OWN workspace, so the `cargo test --workspace` above
    # does not reach it — its unit tests (the harness isolation gate, the region
    # and key parsers, the config-root override) would only ever run on whoever
    # remembered to type this by hand. The gate is what stops a `--harness`
    # instance writing over the user's real session, so a regression in it must
    # not be able to ship green. Windows because gpui builds and tests there and
    # that is where the desktop suite ships.
    runs-on: windows-latest
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: suite
      - name: Format
        run: cargo fmt --all --check --manifest-path suite/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path suite/Cargo.toml --all-targets --locked -- -D warnings
      # Includes ribbon_export: the checked-in ribbon snapshot the editable-HTML
      # page draws must match the suite's live ribbon.
      - name: Test
        run: cargo test --manifest-path suite/Cargo.toml --locked

  suite-linux:
    name: desktop suite (linux)
    # The suite ships on Windows and macOS and should build on Linux too (#504): gpui's
    # x11/wayland backends are enabled. Tests run under Xvfb. The Windows job above is
    # the one that gates the harness isolation tests on the platform the suite ships on.
    runs-on: ubuntu-latest
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: suite
      - name: System packages gpui needs on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             pkg-config clang cmake             libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev             libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev             libwayland-dev libvulkan-dev mesa-vulkan-drivers             libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev             xvfb openbox x11-utils
      - name: Clippy
        run: cargo clippy --manifest-path suite/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: xvfb-run -a cargo test --manifest-path suite/Cargo.toml --locked
      # window_close (#1226) closes the suite's window through X11 and drives the
      # debug suite the Test step left in suite/target/debug (docxy's integration
      # tests build the binary).
      - name: Linux window capture and close
        run: python3 scripts/ui-linux.py -- cargo test -p uiharness --locked --test linux_capture --test window_close -- --ignored

  ui-sweep-linux:
    name: ui sweep (linux)
    # Every uiharness/cases/*.uit, each in a fresh release suite on a private Xvfb +
    # Openbox display, checked against uiharness/cases/expected-failures.txt (#979).
    # A job of its own so the release build runs beside suite-linux's debug tests.
    runs-on: ubuntu-latest
    # No DOCXY_BUILD_KIND here on purpose: build-info.uit asserts this sweep's suite
    # reports kind `local` (and so a manual build), the one kind only a hand build has (#1023).
    # Two cold release builds come first; the sweep itself took 105 s locally.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            suite -> target
            . -> target
      - name: System packages gpui needs on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             pkg-config clang cmake             libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev             libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev             libwayland-dev libvulkan-dev mesa-vulkan-drivers             libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev             xvfb openbox x11-utils
      - name: Build release suite
        run: cargo build --release --locked --manifest-path suite/Cargo.toml
      # The terminal editors beside it: the terminal-*.uit scripts run them in a
      # pseudo-terminal, found next to uiharness (#1204). The fixture format
      # plugin too: project-plugin.uit's `plugin yppx_fixture` copies it from
      # there into the suite's sandbox.
      - name: Build release uiharness, the terminal editors and the fixture plugin
        run: cargo build --release --locked -p uiharness -p docxy -p xlsxy -p yppxy -p plugin_fixture
      - name: Sweep runner unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      # The slowest script took 13 s locally: a per-script --timeout turns a hang
      # into an ERROR row with a summary written, well inside the step's limit.
      - name: Sweep
        timeout-minutes: 30
        run: python3 scripts/ui-linux-sweep.py --timeout 120 --run "$GITHUB_WORKSPACE/uiharness-runs/sweep"
      # cancelled() too: a job that hits timeout-minutes is cancelled, not failed,
      # and that is when the transcripts matter most.
      - name: Upload the sweep's transcripts and evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ui-sweep-linux
          path: uiharness-runs/sweep
          if-no-files-found: ignore

  ui-sweep-windows:
    name: ui sweep (windows)
    # The Linux sweep's counterpart: every uiharness/cases/*.uit, each in a fresh
    # release suite on a Win32 desktop of its own (`uiharness --desktop`), checked
    # against uiharness/cases/expected-failures-windows.txt, the Windows baseline
    # (#1544). #1234 was a Windows-only transport defect that only a manual daily
    # sweep found (#1405).
    runs-on: windows-latest
    # No DOCXY_BUILD_KIND here on purpose: build-info.uit asserts this sweep's suite
    # reports kind `local`, as on ui-sweep-linux (#1023).
    # Windows runs the scripts two to three times slower than Linux, so each gets
    # 420 s (the longest inputs-typing scripts take over 120 s there).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            suite -> target
            . -> target
      - name: Build release suite
        run: cargo build --release --locked --manifest-path suite/Cargo.toml
      - name: Build release uiharness, the terminal editors and the fixture plugin
        run: cargo build --release --locked -p uiharness -p docxy -p xlsxy -p yppxy -p plugin_fixture
      - name: Sweep runner unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      # The runner's desktop is 1024x768, and Windows caps a window at the screen
      # plus its frame, so every `window-size` wider than that came out 1028x780
      # and the cases saw a narrower ribbon than they asked for (#1779). Give the
      # sweep a 1920x1080 screen (the widest case asks for 1400x800 logical px),
      # and fail here, with the mode got and the modes offered, if the mode is
      # below 1920x1080 or the screen at the runner's scale is below 1400x800 plus
      # the frame. The readback is the display mode, not Screen.Bounds or
      # GetSystemMetrics, which a DPI-unaware pwsh reports scaled down.
      - name: Set the display to 1920x1080
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Display {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
                  public int dmFields;
                  public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
                  public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
                  public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType;
                  public int dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
              }
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
              [DllImport("user32.dll")]
              public static extern bool SetProcessDpiAwarenessContext(IntPtr context);
              [DllImport("user32.dll")]
              public static extern uint GetDpiForSystem();
              public static DEVMODE Mode(int index) {
                  var dm = new DEVMODE();
                  dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  if (!EnumDisplaySettings(null, index, ref dm)) dm.dmPelsWidth = -1;
                  return dm;
              }
          }
          '@
          $current = -1  # ENUM_CURRENT_SETTINGS
          $dm = [Display]::Mode($current)
          "before: $($dm.dmPelsWidth)x$($dm.dmPelsHeight)"
          $dm.dmPelsWidth = 1920
          $dm.dmPelsHeight = 1080
          $dm.dmFields = 0x80000 -bor 0x100000  # DM_PELSWIDTH | DM_PELSHEIGHT
          $code = [Display]::ChangeDisplaySettings([ref]$dm, 0)  # this session only
          "ChangeDisplaySettings: $code (0 is DISP_CHANGE_SUCCESSFUL)"
          $got = [Display]::Mode($current)
          $aware = [Display]::SetProcessDpiAwarenessContext([IntPtr]-4)  # per-monitor v2, for a true DPI
          $dpi = [Display]::GetDpiForSystem()
          $logW = [math]::Floor($got.dmPelsWidth * 96 / $dpi)
          $logH = [math]::Floor($got.dmPelsHeight * 96 / $dpi)
          "after: $($got.dmPelsWidth)x$($got.dmPelsHeight), DPI awareness set: $aware, system DPI $dpi, logical ${logW}x${logH}"
          if ($code -ne 0 -or $got.dmPelsWidth -lt 1920 -or $got.dmPelsHeight -lt 1080 -or $logW -lt 1410 -or $logH -lt 815) {
            $modes = for ($i = 0; ($m = [Display]::Mode($i)).dmPelsWidth -ge 0; $i++) { "$($m.dmPelsWidth)x$($m.dmPelsHeight)" }
            "modes offered: $(($modes | Select-Object -Unique) -join ', ')"
            Write-Error "the display is $($got.dmPelsWidth)x$($got.dmPelsHeight) (logical ${logW}x${logH} at $dpi DPI), the sweep needs 1920x1080 and 1410x815 logical (#1779)"
            exit 1
          }
      - name: Sweep
        timeout-minutes: 90
        run: python scripts/ui-linux-sweep.py --timeout 420 --expected uiharness/cases/expected-failures-windows.txt --suite suite/target/release/suite.exe --uiharness target/release/uiharness.exe --run "${{ github.workspace }}/uiharness-runs/sweep"
      - name: Upload the sweep's transcripts and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-sweep-windows
          path: uiharness-runs/sweep
          if-no-files-found: ignore

  suite-macos:
    name: desktop suite (macos)
    # Releases already build the suite on macOS; this catches a macOS break in the PR
    # that causes it instead of at release time (#505).
    runs-on: macos-latest
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: suite
      - name: Clippy
        run: cargo clippy --manifest-path suite/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path suite/Cargo.toml --locked

  webapp:
    name: editable HTML (${{ matrix.os }})
    # The browser half of editable HTML (htmlbundle/web): node unit tests, then
    # Playwright in Chromium and Firefox against pages exported by a real
    # docxy. Screenshot baselines (@visual) run on Windows only, where the
    # document fonts exist; the ubuntu leg runs everything else.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # What `--version` and File > Account report for this build (#1023).
    env:
      DOCXY_BUILD_KIND: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux clipboard deps (arboard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build docxy with HTML export
        run: cargo build -p docxy --features html-export --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install
        working-directory: webapp
        run: npm ci
      - name: Install browsers
        working-directory: webapp
        run: npx playwright install --with-deps chromium firefox
      - name: Unit tests
        working-directory: webapp
        run: npm run test:unit
      - name: Browser tests
        working-directory: webapp
        env:
          CI: "1"
          DOCXY_BIN: ../target/debug/docxy
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            webapp/playwright-report
            webapp/test-results

  jetbrains:
    name: jetbrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test the plugin
        working-directory: offxy-jetbrains
        # buildWasm (a Gradle task) runs the cargo wasm build; `build` runs
        # the whole Kotlin test suite including the IntelliJ platform tests
        # (headless) and the edit-pipeline property test.
        run: ./gradlew build buildPlugin --no-daemon
      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: offxy-jetbrains-zip
          path: offxy-jetbrains/build/distributions/*.zip
