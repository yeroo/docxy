[package]
name = "docxy"
description = "Docxy — a fast terminal (TUI) viewer and editor for Microsoft Word .docx documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["docx", "word", "tui", "editor", "ooxml"]
categories = ["command-line-utilities", "text-editors"]

[[bin]]
name = "docxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
opccore = { version = "0.1.0", path = "../opccore" }
# Path + version so `docxy` can be published once `docxcore` is on crates.io.
docxcore = { version = "0.5.0", path = "../docxcore" }
# The agent control surface (loopback-TCP + newline-JSON), used to drive the
# live document from a sibling agwinterm pane.
ctlcore = { version = "0.5.0", path = "../ctlcore" }
# ratatui re-exports crossterm, so we don't depend on crossterm separately.
ratatui = "0.29"
ribboncore = { version = "0.1.0", path = "../ribboncore" }
backstagecore = { version = "0.1.0", path = "../backstagecore" }
# Editable HTML (*.docx.html): open and save bundles (always), and make new
# ones (only with the `html-export` feature, which embeds the wasm engine).
htmlbundle = { version = "0.5.0", path = "../htmlbundle" }
# OS clipboard bridge (copy/paste across applications).
arboard = "3"
# Inline images (kitty/iTerm2/Sixel, with a half-block fallback).
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
# Only the raster formats Word actually embeds; avoids heavy AVIF/AV1 codecs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
# Unicode Bidirectional Algorithm for DOCX visual-line projection; kept in the
# TUI crate so docxcore remains std-only.
unicode-bidi = "0.3.18"

# Rasterize legacy WMF/EMF vector images via the OS's GDI (Windows only).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_SystemInformation"] }

[build-dependencies]
htmlbundle = { version = "0.5.0", path = "../htmlbundle" }

[features]
# Embed the docxwasm engine so `--html` and Save As *.docx.html can make new
# editable-HTML files. Needs `rustup target add wasm32-unknown-unknown`, or
# DOCXY_HTML_ENGINE=<path to a prebuilt docxwasm.wasm>. Off by default so a
# plain `cargo install docxy` needs no wasm toolchain; opening and saving an
# existing .docx.html works either way.
html-export = []
