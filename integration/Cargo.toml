[package]
name = "docxy-integration"
description = "The C ABI of an integration plugin: one shared library that gives a host its product names, icons, sign-in settings, a silent token source and the user's organization. The host side (loader, worker thread, crash marker) is the `host` feature."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["plugin", "ffi", "abi"]
categories = ["api-bindings"]

[lib]
name = "docxy_integration"

[lints]
workspace = true

[features]
# A plugin depends on this crate with `default-features = false`: the ABI
# types and the protocol only.
default = ["host"]
host = ["dep:libloading", "dep:libc", "dep:windows-sys"]

[dependencies]
# The JSON value that crosses projcore's plugin ABI; projcore's default build
# is std-only apart from opccore.
projcore = { version = "0.1.0", path = "../projcore" }
libloading = { version = "0.8", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
