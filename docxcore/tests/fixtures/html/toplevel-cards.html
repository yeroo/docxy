<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Office notice</title>
<style>
  body { background: #F4F4F4; font-family: Arial, sans-serif; }
  .callout { background: #FFF4E5; padding: 12px 16px; }
  .stack { background: #EEF2FF; padding: 8px; }
</style>
</head>
<body>
<div class="elementToProof" style="font-family: Aptos, sans-serif; background-color: rgb(255, 255, 255);">Hi team,</div>
<div class="callout">
  <p>Heads up: the office is closed on Friday.</p>
  <table border="1"><tr><td>Mon</td><td>Open</td></tr><tr><td>Fri</td><td>Closed</td></tr></table>
</div>
<div style="background: #FAFAFA; max-width: 600px; margin: 0 auto; padding: 10px;">Centred summary</div>
<div class="stack">First stacked</div>
<div class="stack">Second stacked</div>
<blockquote style="border-left: 2px solid #CCCCCC; padding-left: 8px; margin-left: 0;">
  <div style="background: #F0F0F0; padding: 6px;">Quoted note</div>
</blockquote>
</body>
</html>
