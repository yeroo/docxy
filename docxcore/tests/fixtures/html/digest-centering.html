<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly digest</title>
<style>
  body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
  img { border: 0; display: block; }
  .card { margin: 0 auto; }
  .note { width: 300px; margin: 12px auto; padding: 0 20px; }
</style>
</head>
<body>
<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#EEEEEE">
  <tr>
    <td align="center" valign="top">
      <table width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF">
        <tr>
          <td style="padding:16px">
            <a href="https://example.com/"><img src="logo.png" width="120" height="40" alt="Example"></a>
            <h1 style="text-align:left">Your weekly digest</h1>
            <p>Three new posts this week.</p>
          </td>
        </tr>
        <tr>
          <td align="left" style="padding:16px">
            <table align="left" width="260" cellpadding="0" cellspacing="0" border="0">
              <tr><td>Left column</td></tr>
            </table>
            <table align="right" width="260" cellpadding="0" cellspacing="0" border="0">
              <tr><td>Right column</td></tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<table class="card" width="500" cellpadding="8" cellspacing="0" border="0">
  <tr><td>A card centred by its margins.</td></tr>
</table>

<center>
  <table width="400" cellpadding="0" cellspacing="0" border="0">
    <tr><td>Inside a center element.</td></tr>
  </table>
  <p>Centred text.</p>
</center>

<div>
  <img src="hero.png" width="300" height="100" alt="Hero" style="margin:0 auto">
  <p>After the hero.</p>
</div>

<div class="note">A note in a 300 px box, centred on the page.</div>

<div style="text-align:center">
  <table width="200" cellpadding="0" cellspacing="0" border="0">
    <tr><td>Plain text-align does not move me.</td></tr>
  </table>
</div>
</body>
</html>
