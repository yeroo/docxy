<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northwind Monthly</title>
<style type="text/css">
  /* Reset */
  body, table, td { margin: 0; padding: 0; }
  body { background-color: #F4F4F4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #333333; }
  .wrapper { background: #F4F4F4; padding: 20px 0; }
  .content { background-color: #FFFFFF; }
  #headline { font-size: 28px; color: #0B5394; font-weight: bold; line-height: 34px; margin: 0 0 12px 0; }
  .lead { font-size: 16px; line-height: 1.5; }
  .content td > p { margin: 0 0 10px; }
  .content .note { color: #777; font-style: italic; }
  div.footer p { font-size: 11px; color: #999999; text-align: center; }
  a:hover { color: red; }
  .btn + .btn { margin-left: 4px; }
  @media only screen and (max-width: 600px) {
    #headline { font-size: 22px !important; color: green !important; }
    .lead { font-size: 14px !important; }
  }
  @font-face { font-family: 'Brand'; src: url(brand.woff2) format('woff2'); }
</style>
<!--[if mso]>
<style> #headline { font-family: Arial, sans-serif; } </style>
<![endif]-->
</head>
<body>
<div style="display:none;font-size:1px;color:#F4F4F4;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">This month: spring catalogue, new stores and more.</div>
<div class="wrapper">
<table class="content" role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding: 30px 40px;">
      <h1 id="headline">Spring catalogue is here</h1>
      <p class="lead">Dear customer, our <strong>new range</strong> arrives on <span style="background-color:#FFF2CC;">March&nbsp;3</span>.</p>
      <p class="note">Prices include VAT.</p>
      <p style="font-family:'Courier New', monospace; font-size:13px">Code: SPRING26</p>
    </td>
  </tr>
</table>
<div class="footer">
  <p>Northwind Traders, 1 Harbour Road</p>
  <p style="color:#CC0000 !important">Unsubscribe</p>
</div>
</div>
</body>
</html>
