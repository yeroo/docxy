<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Team digest</title>
<style>
  body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
  img { border: 0; }
  img.avatar { border-radius: 50%; }
  .card { border-radius: 8px; background: #F4F6F8; padding: 12px; }
  .badge { border-radius: 12px; background-color: #DDEEFF; padding: 2px 8px; }
</style>
</head>
<body>
<table width="600" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:16px">
      <img src="header.png" width="120" height="40" alt="Header" style="border-radius:8px">
      <p>Your team this week.</p>
    </td>
  </tr>
  <tr>
    <td class="card">
      <img src="ann.png" width="32" height="32" alt="Ann" style="border-radius:50%">
      Ann posted <span class="badge">3 new</span> updates.
    </td>
  </tr>
  <tr>
    <td style="border-radius:8px; background:#FFF8E1; padding:12px">
      <img class="avatar" src="bob.png" width="32" height="32" alt="Bob">
      Bob commented.
    </td>
  </tr>
  <tr>
    <td>
      <div style="border-radius:8px; background:#E8F5E9; padding:12px">
        <img src="cy.png" width="32" height="32" alt="Cy" style="border-radius:16px">
        Cy joined.
      </div>
    </td>
  </tr>
  <tr>
    <td>
      <img src="chart.png" width="200" height="100" alt="Chart">
      <img src="tab.png" width="80" height="24" alt="Tab" style="border-top-left-radius:6px">
    </td>
  </tr>
</table>
</body>
</html>
