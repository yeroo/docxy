<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly digest</title>
<style>
  body { margin: 0; padding: 0; background: #E9ECEF; font-family: Arial, sans-serif; }
  .card { background-color: #F1F3F5; padding: 16px; }
  .item { background: #FAFAFA; padding: 10px; }
  .divider { height: 1px; line-height: 1px; font-size: 1px; background: #DEE2E6; }
</style>
</head>
<body>
<table width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#E9ECEF" align="center">
  <tr>
    <td bgcolor="#FFFFFF" style="padding:24px">
      <h1>Your week</h1>
      <div class="card">
        <p>Three projects moved this week.</p>
        <table width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="background:#DDDDDD; padding:8px 12px">
              <div class="item">
                <p>Atlas shipped 1.4.</p>
              </div>
              <div class="divider">&nbsp;</div>
              <div class="item">
                <p>Borealis is in review.</p>
              </div>
            </td>
          </tr>
          <tr>
            <td bgcolor="#CCCCCC" style="padding:4px">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#BBBBBB; padding:6px 6px 2px 6px">Comet: 2 open issues.</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>
      <p>See you next week.</p>
    </td>
  </tr>
</table>
</body>
</html>
