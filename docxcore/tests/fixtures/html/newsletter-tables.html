<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contoso Weekly</title>
<style type="text/css">
  body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
  .card { background-color: #EAF2FB; }
  .card td.badge { background: #1F6FB2; color: #FFFFFF; }
  .spacer { line-height: 1px; font-size: 1px; }
</style>
</head>
<body bgcolor="#DDDDDD">
<table class="wrapper" width="100%" bgcolor="#DDDDDD" border="0" cellpadding="0" cellspacing="0" role="presentation">
  <tr>
    <td align="center" valign="top">
      <table class="container" width="600" align="center" border="0" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" role="presentation">
        <tr>
          <td colspan="2" bgcolor="#0B5394" style="padding: 20px 30px; color: #FFFFFF;">
            <h1 style="margin:0; font-size:24px;">Contoso Weekly</h1>
          </td>
        </tr>
        <tr>
          <td width="200" valign="top" style="padding: 20px;">
            <p>Sidebar: this week's picks.</p>
          </td>
          <td width="400" valign="top" style="padding: 20px 20px 20px 0;">
            <p>Main story: our stores open late on Fridays.</p>
            <table class="card" width="100%" border="0" cellpadding="8" cellspacing="0" role="presentation">
              <tr>
                <td class="badge" width="80">NEW</td>
                <td>Gift cards now come in any amount.</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td rowspan="2" valign="middle" style="background-color:#FCE5CD;">Offers</td>
          <td>Ten percent off garden tools.</td>
        </tr>
        <tr>
          <td>Free delivery over fifty pounds.</td>
        </tr>
        <tr>
          <td colspan="2" style="padding: 20px;">
            <table border="1" cellpadding="4" cellspacing="0" width="100%">
              <tr><th>Store</th><th>Friday hours</th></tr>
              <tr><td>Harbour Road</td><td>9 to 21</td></tr>
              <tr><td>Market Square</td><td>9 to 22</td></tr>
            </table>
          </td>
        </tr>
        <tr>
          <td colspan="2" class="spacer" height="20">&nbsp;</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
